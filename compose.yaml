x-app: &app
  build: .
  init: true
  restart: "no"
  env_file: ./config/app.env
  environment: &app-env
    APP_HOST: "127.0.0.1"
    APP_PORT: "8080"
    APP_MESSAGE: "Welcome to BARQ Systems"
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2)"]
    interval: 5s
    timeout: 3s
    retries: 3
    start_period: 3s

services:
  database:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    environment:
      POSTGRES_USER: barq_app
      POSTGRES_DB: barq_tasks
      POSTGRES_PASSWORD: BarqTask_7qN2vK8c
    volumes:
      - database-data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U barq_app -d barq_tasks"]
      interval: 3s
      timeout: 3s
      retries: 10
    networks: [application]

  app-1:
    <<: *app
    environment:
      <<: *app-env
      INSTANCE_ID: "app-1"
    networks: [application]

  app-2:
    <<: *app
    environment:
      <<: *app-env
      INSTANCE_ID: "app-1"
    networks: [application]

  proxy:
    image: nginx:1.28-alpine@sha256:a8b39bd9cf0f83869a2162827a0caf6137ddf759d50a171451b335cecc87d236
    ports:
      - "127.0.0.1:${PUBLIC_PORT:-8088}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app-1
      - app-2
    networks: [application, frontend]

networks:
  application:
    internal: true
  frontend:

volumes:
  database-data:
